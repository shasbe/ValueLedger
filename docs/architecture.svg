<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 640" role="img"
     aria-label="ValueLedger architecture. Everything that reads prompts runs on the developer's machine; only labels and token counts cross into Cloud Run, where the ledger lives."
     style="max-width:100%;height:auto;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9772f"/>
    </marker>
  </defs>

  <!-- ══ zones ══ -->
  <rect x="26" y="46" width="416" height="122" rx="9" fill="none" stroke="currentColor" stroke-opacity=".28"/>
  <text x="42" y="70" font-size="12" font-weight="600" fill="currentColor" opacity=".62">CHAT &#183; claude.ai or Claude Desktop</text>

  <rect x="26" y="196" width="416" height="404" rx="9" fill="none" stroke="currentColor" stroke-opacity=".28"/>
  <text x="42" y="220" font-size="12" font-weight="600" fill="currentColor" opacity=".62">THE DEVELOPER&#8217;S MACHINE</text>

  <rect x="566" y="46" width="428" height="554" rx="9" fill="none" stroke="currentColor" stroke-opacity=".28"/>
  <text x="582" y="70" font-size="12" font-weight="600" fill="currentColor" opacity=".62">CLOUD RUN</text>

  <!-- ══ trust boundary ══ -->
  <line x1="504" y1="34" x2="504" y2="614" stroke="#d9772f" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="504" y="26" text-anchor="middle" font-size="12.5" font-weight="700" fill="#d9772f">TRUST BOUNDARY</text>
  <text x="497" y="528" text-anchor="middle" font-size="12" font-weight="600" fill="#d9772f"
        transform="rotate(-90 497 528)">prompt text never crosses</text>

  <!-- ══ chat lane ══ -->
  <rect x="50" y="86" width="368" height="62" rx="7" fill="none" stroke="currentColor" stroke-opacity=".85"/>
  <text x="66" y="110" font-size="14" font-weight="600" fill="currentColor">attribute-work skill</text>
  <text x="66" y="130" font-size="11.5" fill="currentColor" opacity=".7">chat leaves no transcript, so it files its own work</text>

  <!-- ══ machine lane ══ -->
  <rect x="50" y="240" width="176" height="60" rx="7" fill="none" stroke="currentColor" stroke-opacity=".85"/>
  <text x="64" y="264" font-size="13" font-weight="600" fill="currentColor">~/.claude/projects</text>
  <text x="64" y="283" font-size="11" fill="currentColor" opacity=".7">Claude Code + Cowork</text>

  <rect x="248" y="240" width="170" height="60" rx="7" fill="none" stroke="currentColor" stroke-opacity=".85"/>
  <text x="262" y="264" font-size="13" font-weight="600" fill="currentColor">git repository</text>
  <text x="262" y="283" font-size="11" fill="currentColor" opacity=".7">commits, merged PRs</text>

  <rect x="50" y="356" width="368" height="56" rx="7" fill="none" stroke="currentColor" stroke-opacity=".85"/>
  <text x="66" y="379" font-size="14" font-weight="600" fill="currentColor">Collector</text>
  <text x="66" y="398" font-size="11.5" fill="currentColor" opacity=".7">scheduled; prices each session from raw token counts</text>

  <rect x="50" y="456" width="368" height="72" rx="7" fill="none" stroke="#d9772f" stroke-width="1.6"/>
  <text x="66" y="479" font-size="14" font-weight="600" fill="currentColor">Classifier</text>
  <text x="66" y="498" font-size="11.5" fill="currentColor" opacity=".7">small model, reads the prompts, applies the policy</text>
  <text x="66" y="517" font-size="11.5" font-weight="600" fill="#d9772f">runs here &#8212; this is why prompts stay put</text>

  <!-- machine arrows -->
  <g color="currentColor" opacity=".8">
    <line x1="138" y1="300" x2="138" y2="352" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="333" y1="300" x2="333" y2="352" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="234" y1="412" x2="234" y2="452" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  </g>
  <text x="146" y="330" font-size="11" fill="currentColor" opacity=".75">sessions, tokens</text>
  <text x="341" y="330" font-size="11" fill="currentColor" opacity=".75">outcomes</text>
  <text x="242" y="437" font-size="11" fill="currentColor" opacity=".75">prompts</text>

  <!-- ══ crossings ══ -->
  <g color="#d9772f">
    <line x1="418" y1="117" x2="592" y2="117" stroke="#d9772f" stroke-width="2" marker-end="url(#ac)"/>
    <line x1="418" y1="492" x2="592" y2="492" stroke="#d9772f" stroke-width="2" marker-end="url(#ac)"/>
    <line x1="592" y1="300" x2="422" y2="300" stroke="#d9772f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ac)"/>
  </g>
  <text x="505" y="106" text-anchor="middle" font-size="11.5" font-weight="600" fill="#d9772f">labels only &#8212; no cost</text>
  <text x="505" y="481" text-anchor="middle" font-size="11.5" font-weight="600" fill="#d9772f">labels + token counts</text>
  <text x="505" y="289" text-anchor="middle" font-size="11.5" font-weight="600" fill="#d9772f">policy bundle</text>
  <text x="505" y="316" text-anchor="middle" font-size="10.5" fill="#d9772f" opacity=".85">fetched before every run</text>

  <!-- ══ cloud ══ -->
  <rect x="592" y="92" width="378" height="54" rx="7" fill="none" stroke="currentColor" stroke-opacity=".85"/>
  <text x="608" y="114" font-size="13.5" font-weight="600" fill="currentColor">MCP server + OAuth 2.1</text>
  <text x="608" y="132" font-size="11" fill="currentColor" opacity=".7">identity from the token, never the payload</text>

  <rect x="592" y="184" width="378" height="212" rx="7" fill="none" stroke="currentColor" stroke-opacity=".85"/>
  <text x="608" y="208" font-size="14" font-weight="600" fill="currentColor">AttributionService</text>

  <rect x="610" y="224" width="342" height="46" rx="5" fill="none" stroke="currentColor" stroke-opacity=".45"/>
  <text x="624" y="243" font-size="12" fill="currentColor">Ingest + price book</text>
  <text x="624" y="260" font-size="10.5" fill="currentColor" opacity=".7">cost computed here, never accepted from a client</text>

  <rect x="610" y="280" width="342" height="46" rx="5" fill="none" stroke="currentColor" stroke-opacity=".45"/>
  <text x="624" y="299" font-size="12" fill="currentColor">Attribution Policy</text>
  <text x="624" y="316" font-size="10.5" fill="currentColor" opacity=".7">versioned prompt bundle &#8212; the single source of truth</text>

  <rect x="610" y="336" width="342" height="46" rx="5" fill="none" stroke="currentColor" stroke-opacity=".45"/>
  <text x="624" y="355" font-size="12" fill="currentColor">Ledger</text>
  <text x="624" y="372" font-size="10.5" fill="currentColor" opacity=".7">one row per session &#183; cost joined to outcomes</text>

  <rect x="592" y="436" width="378" height="60" rx="7" fill="none" stroke="currentColor" stroke-opacity=".85"/>
  <text x="608" y="459" font-size="13.5" font-weight="600" fill="currentColor">Dashboards</text>
  <text x="608" y="478" font-size="11" fill="currentColor" opacity=".7">CFO view &#183; initiative owner &#183; individual &#8212; scoped server-side</text>

  <rect x="592" y="524" width="378" height="54" rx="7" fill="none" stroke="currentColor" stroke-opacity=".85"/>
  <text x="608" y="546" font-size="13.5" font-weight="600" fill="currentColor">Admin UI + vlconfig</text>
  <text x="608" y="564" font-size="11" fill="currentColor" opacity=".7">the taxonomy, authored as YAML and applied</text>

  <g color="currentColor" opacity=".7">
    <line x1="781" y1="146" x2="781" y2="180" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="781" y1="396" x2="781" y2="432" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="781" y1="524" x2="781" y2="400" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
  </g>
  <text x="792" y="168" font-size="10.5" fill="currentColor" opacity=".75">publishes</text>
  <text x="792" y="418" font-size="10.5" fill="currentColor" opacity=".75">reads</text>
  <text x="772" y="516" font-size="10.5" fill="currentColor" opacity=".75" text-anchor="end">defines</text>
</svg>
